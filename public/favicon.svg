<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#07070b"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Headphone Arc -->
  <path d="M 20 34 A 12 12 0 0 1 44 34" fill="none" stroke="url(#purpleGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Left Earbud Capsule -->
  <rect x="16" y="32" width="7" height="13" rx="3.5" fill="#e2e8f0"/>
  <!-- Right Earbud Capsule -->
  <rect x="41" y="32" width="7" height="13" rx="3.5" fill="#e2e8f0"/>
  <!-- Glowing Center Pulse -->
  <circle cx="32" cy="22" r="2.5" fill="#c084fc"/>
</svg>